# Builds on every push / PR. When a GitHub release is published (or on manual run with a tag),
# publishes two single-file builds and attaches them to that release:
#   DynamicIsland-<tag>-win-x64.exe             small, needs the .NET 10 Desktop Runtime
#   DynamicIsland-<tag>-win-x64-standalone.exe  large, runtime included, runs anywhere

name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach the builds to
        required: true

permissions:
  contents: write

env:
  PROJECT: DynamicIsland.csproj
  RID: win-x64

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build $env:PROJECT -c Release

  release:
    needs: build
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Note: use --no-self-contained; on the .NET 10 CLI "--self-contained false" is read as true.
      - name: Publish (needs .NET runtime)
        run: |
          dotnet publish $env:PROJECT -c Release -r $env:RID --no-self-contained `
            -p:PublishSingleFile=true -p:DebugType=none -o out/small
          Remove-Item bin, obj -Recurse -Force

      - name: Publish (standalone)
        run: |
          dotnet publish $env:PROJECT -c Release -r $env:RID --self-contained `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true -p:DebugType=none -o out/full

      - name: Rename
        run: |
          New-Item dist -ItemType Directory | Out-Null
          Move-Item out/small/DynamicIsland.exe "dist/DynamicIsland-$env:TAG-$env:RID.exe"
          Move-Item out/full/DynamicIsland.exe "dist/DynamicIsland-$env:TAG-$env:RID-standalone.exe"
          Get-ChildItem dist | Format-Table Name, Length

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: dist/*.exe
          append_body: true
          body: |

            ### Download
            | File | Size | Notes |
            |---|---|---|
            | `DynamicIsland-${{ env.TAG }}-win-x64.exe` | ~30 MB | Needs the [.NET 10 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/10.0) (x64) |
            | `DynamicIsland-${{ env.TAG }}-win-x64-standalone.exe` | ~80 MB | Runtime included, just run it |
